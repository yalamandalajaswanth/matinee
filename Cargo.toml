[package]
name = "matinee"
version = "0.1.0"
edition = "2021"
description = "Stream the movies on your PC to DeoVR on Meta Quest over your home network"
license = "MIT"
repository = "https://github.com/yalamandalajaswanth/matinee"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
local-ip-address = "0.6.13"
qrcode = { version = "0.14.1", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
